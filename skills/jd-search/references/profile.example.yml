# jd-search 프로필 — 이 파일 하나만 바꾸면 다른 사람이 그대로 돌린다.
# 저장 위치: ~/.jd-search/<프로필ID>/profile.yml
# 🔴 이 파일은 개인정보다. 저장소에 커밋하지 말 것.

version: 1
id: default

# ── 1. 무슨 일을 찾는가 ──────────────────────────────────────────────
# 이력서를 넣으면 아래 roles/years/domains를 대신 채워 준다.
# 문서가 없으면 references/role-presets.yml 에서 직군을 고른다.
target:
  # 포함 키워드 (OR). 공고 제목에 하나라도 걸리면 수집한다.
  # 🔴 **한국 잡보드에서 실제로 쓰이는 표기를 빠짐없이 넣어야 한다.**
  #    "PO"만 넣고 "프로덕트 오너"를 빼면 한글 표기 공고가 **전량 조용히 사라진다**(실측 확인).
  #    영문 약어(PM·PO)는 낱말 경계로 매칭하므로 한글 제목에는 걸리지 않는다.
  #    잘려 나간 제목은 state/dropped.json 의 titleKeywordMiss 에 전부 남으니 한 번 훑어볼 것.
  roles:
    - 서비스기획
    - 서비스 기획
    - 프로덕트 매니저
    - 프로덕트매니저
    - 프로덕트 오너
    - 프로덕트오너
    - Product Manager
    - Product Owner
    - PM
    - PO
    - UX 기획
  excludeRoles:               # 제외 키워드 (AND NOT). 키워드가 겹쳐 딸려 오는 직무를 자른다
    - 사업개발
    - 전략기획
    - 경영기획
  excludeIndustries:
    - 블록체인
  # ── 연차 ──
  # 🔴 이 두 값은 **공고를 버리는 데 쓰이지 않는다.** 목록을 나누는 데만 쓴다.
  #    판정은 언제나 "내 연차 대비"라서 신입이든 시니어든 같은 코드가 돈다.
  years: 5                    # 내 경력(년). 신입이면 0.
                              #   요구경력이 이 값보다 높은 공고 → `요구경력 높음` 태그
  # acceptExperienceFloor: 3  # 요구 하한이 이 값 미만이면 `요구경력 낮음` 태그
                              #   🔴 **기본은 미설정(=분류 안 함)이다.** 값을 정하지 않으면 아무 태그도 안 붙는다.
                              #      섣불리 넣으면 목록의 대부분이 "따로 모음"으로 빠져 정작 볼 것이 안 보인다.
  #
  # 연차별로 이렇게 잡으면 된다 (위 두 줄만 바꾸면 끝)
  #
  #   신입 · 1년차 미만
  #     years: 0
  #     # acceptExperienceFloor 는 두지 않는다 — 나보다 낮은 요구경력이라는 게 없다.
  #     → `경력무관`·`신입` 공고가 태그 없이 본 목록에 뜨고, `경력 5년↑`은 `요구경력 높음`으로 표시된다.
  #
  #   미들 · 3~7년차
  #     years: 5
  #     # acceptExperienceFloor: 2   ← 신입 공고까지 굳이 안 보겠다면 그때 켠다
  #
  #   시니어 · 10년차 이상
  #     years: 12
  #     acceptExperienceFloor: 8     ← 요구경력 8년 미만은 따로 모아 나중에 본다

  domains:                    # 이력서에서 뽑힌 도메인. 표시·정렬 참고용이며 점수화하지 않는다
    - B2B SaaS
    - 위치데이터
    - 커머스

# ── 2. 어디까지 다닐 수 있는가 ───────────────────────────────────────
location:
  home: "서울 마포구"           # 예시입니다. 동·읍·면까지면 충분
                               # 🔴 이 파일(로컬 프로필)에는 적은 그대로 남는다.
                               #    리포트(report.html)에는 주소도 좌표도 나가지 않는다 — 공유될 수 있는 파일이라서다.
  # homeCoord:                 # 카카오 키가 있으면 온보딩이 채운다. 없으면 비워 두면 된다
  #   lat: 37.5663             # 있으면 공고까지의 직선거리를 참고로 붙인다
  #   lng: 126.9019            # 🔴 직선거리로 공고를 버리지는 않는다. 표시·정렬용이다
  # ⏳ 아래 3개(maxCommuteMin·maxTransfers·hybridFactor)와 precise 는 **아직 동작하지 않는다.**
  #    통근 실측(commute 단계)이 미구현이라 값을 적어도 기록만 되고 공고를 거르지 않는다.
  #    지금 실제로 거르는 것은 아래 regions/denyRegions 뿐이다.
  #    🔴 되는 것처럼 적어 두지 않는다 — 사용자가 60분으로 걸러진 목록이라고 믿게 된다.
  maxCommuteMin: 60            # ⏳ 미적용. 편도 상한(분)
  maxTransfers: 2              # ⏳ 미적용. 환승 상한
  regions:                     # 가고 싶은 시·군·구. 비우면 통근 시간만으로 판단
    - 강남구                    # 🔴 "중구"처럼 전국에 같은 이름이 있는 구는 시·도를 함께 적으십시오
    - 서초구                    #    ("서울 중구"). 안 그러면 게이트가 경고를 냅니다
    - 마포구
    - 성남시 분당구
  denyRegions: []
  remote: bypass               # bypass(거리 무시) | normal | onsiteOnly
  hybridFactor: 1.5            # ⏳ 미적용. 하이브리드 공고의 상한 배수
  precise: false               # ⏳ 미적용. 상위 후보만 정밀 실측 (키 필요)

# ── 3. 가고 싶은 곳 · 피하고 싶은 곳 ────────────────────────────────
# 🔴 watchlist는 위 조건과 무관하게 항상 수집한다. 통근 90분이어도 본다.
watchlist: []
blocklist: []

# ── 4. 기준선 — 현직장 대비 ▲▼ ─────────────────────────────────────
# 회사명만 넣으면 재무를 자동 조회해 기준선을 만든다.
# 비워 두면 ▲▼ 배지가 아예 나타나지 않는다 (신입·전환자).
baseline:
  company: ""
  # year / revenue / operatingProfit / equity 를 직접 넣어 덮어쓸 수도 있다

# ── 5. 수집 대상 ────────────────────────────────────────────────────
# api     = 공식 API 를 호출한다
# web     = 공식 API 가 없어 **공개 검색 페이지의 HTML 을 읽는다**
#           🔴 api 와 구분해 적는다. 둘을 같은 이름으로 묶으면 무엇을 하고 있는지 흐려진다.
#              요청 간 1초를 지키고, 로그인·유료 영역은 건드리지 않는다.
# saved   = **목록을 도구가 못 받는 보드.** 목록이 JS 로 그려지거나 curl 이 막힌다.
#           브라우저에서 검색 결과를 열어 저장(⌘S)한 뒤 이렇게 넣는다:
#             node scripts/collect_saved.mjs --file <저장한.html>
#           저장본에서는 **공고 주소만** 뽑고 회사·마감은 그 보드의 상세 파서가 다시 읽는다.
# browser = 위 셋 다 안 되는 보드. 🔴 실행할 때마다 사용자에게 물어보고 동의해야 연다
# off     = 수집하지 않음
#
# 🔴 위 다섯 가지 외의 값을 적으면 수집이 **에러로 멈춘다.** 오타가 조용히 수집으로 흘러가면 안 된다.
sources:
  wanted:    api
  saramin:   web        # 공개 검색 페이지의 HTML 을 읽는다. 키 불필요.
                        # 🔴 검색이 형태소를 쪼개 확장해 한 단어에 1만 건이 나온다 —
                        #    target.roles 를 제대로 채워야 어디서 멈출지 판단할 수 있다.
                        #    좌표를 주지 않아 이 보드 공고에는 직선거리가 표시되지 않는다.
  jumpit:    api        # 점핏. 공개 JSON API 라 키도 HTML 파싱도 필요 없다.
                        # 🔴 공백이 든 키워드를 사실상 무시한다("서비스 기획" → 전체 목록).
                        #    붙여 쓴 표기("서비스기획")를 roles 에 함께 넣어야 한다 — 수집기가 알려 준다.
  incruit:   web        # 인크루트. 공개 검색 페이지의 HTML 을 읽는다. 키 불필요.
                        # 🔴 EUC-KR 로 내려준다. 인코딩 처리는 수집기 안에 있다.
  jobkorea:  saved      # 🔴 검색 결과가 JS 로 그려져 HTML 에 없다(2026-08-18 실측).
                        #    서버가 보내는 것은 광고·추천 공고뿐이다.
                        #    주소만 있으면 상세는 읽는다 — schema.org JSON-LD 를 심어 준다.
  jobplanet: saved      # ⚠️ curl 403
  rocketpunch: saved    # 목록이 SPA 껍데기라 서버 HTML 에 공고 링크가 0개다
  remember:  browser
  bzpp:      browser
  linkedin:  off        # 🔴 스크래핑 제재가 **사용자 개인 계정**에 온다. 도구가 접속하는 경로는 만들지 않는다.
                        #    보려면 본인이 브라우저에서 연 페이지를 저장해 collect_saved.mjs 에 넣는다.

# ── 6. 재무 ────────────────────────────────────────────────────────
finance:
  enabled: true
  staleYears: 3         # 최신 자료가 이보다 낡으면 등급을 '미확인'으로 내린다
  interviewQuestions: true   # 등급 근거로 면접 질문 생성. 근거가 없으면 만들지 않는다
  investment: true      # DART 조달 공시(유상증자·전환사채·증권신고서)를 함께 본다.
                        # 재무제표는 작년 이야기라 올해 들어온 돈이 안 보인다.
                        # 끄면 조달 공시를 아예 보지 않는다 — 공공데이터포털만으로 재무가 끝난
                        # 회사는 DART 조회 2건이 줄어든다.

# ── 7. 문서 ────────────────────────────────────────────────────────
# 원본은 ~/.jd-search/<프로필ID>/docs/ 에 두고 경로만 적는다.
documents:
  resume: docs/resume.md          # 필수 — 검색 키워드의 뼈대
  career: docs/career.md          # 선택 — 도메인·프로젝트 정밀화
  portfolio: docs/portfolio.md    # 선택 — 산업 태그 추정 + 보관

# ── 8. 제출 서류 — 포지션마다 요구가 다르다 ────────────────────────
# 온보딩이 직군을 보고 채운다. 리포트 카드에 "이 자리는 뭘 내야 하는가"로 표시된다.
# 🔴 이건 **준비 체크리스트지 필터가 아니다.** 포폴이 없다고 공고를 버리지 않는다.
apply:
  docs:
    resume: required              # required | optional | none
    career: required              # 경력기술서. 경력직 공고는 대체로 요구한다
    portfolio: optional           # 🔴 직군에 따라 안 내도 되는 자리가 많다.
                                  #    기본을 required 로 두면 없는 사람이 지원을 접는다
  # 직군별로 다르면 여기서 덮어쓴다. target.roles 의 표기를 그대로 쓴다.
  byRole:
    UX 기획:
      portfolio: required
    프로덕트 오너:
      portfolio: optional

# ── 9. 겹침·공백 — 이력서와 JD 를 같은 사전으로 훑은 결과 ──────────
# 🔴 **점수를 만들지 않는다.** "이 공고가 당신과 87% 맞습니다" 는 검증할 수 없다.
#    여기서 나오는 것은 센 낱말뿐이다 — 겹친 낱말, JD 가 요구하는데 이력서에 없는 낱말.
# 🔴 terms 는 `node scripts/fit.mjs --terms` 로 이력서에서 뽑아 **확인한 뒤** 넣는다.
#    자동으로 채워 넣으면 사용자가 본 적 없는 낱말로 목록이 정렬된다.
# 사전은 references/jd-terms.yml — 여기 없는 낱말은 겹침으로도 공백으로도 안 나온다.
fit:
  enabled: true
  terms:
    - B2B SaaS
    - 커머스
    - 0→1 출시
    - 화면 설계
    - 퍼널 분석
    - 이해관계자 조율
