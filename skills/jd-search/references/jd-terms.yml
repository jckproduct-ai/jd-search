# jd-terms — JD 본문에서 찾아볼 낱말 사전.
#
# 이 파일의 쓰임은 하나다. **JD 가 무엇을 요구하는지**를 셀 수 있는 낱말로 바꾼다.
# 그 결과를 이력서에서 뽑은 낱말과 맞대어 `겹침`과 `공백`을 낸다.
#
# 🔴 점수를 만드는 데 쓰지 않는다. 가중치 칸이 없는 것은 실수가 아니다 —
#    "이 낱말은 3점" 이라고 정하는 순간 검증할 수 없는 숫자가 만들어진다
#    (SKILL.md 「절대 하지 말 것」 1번).
#
# 🔴 여기 없는 낱말은 `공백`으로도 `겹침`으로도 나오지 않는다. 사전이 곧 시야의 한계다.
#    리포트 하단에 "사전에 없어 대조하지 못한 공고"를 함께 싣는 이유다.
#
# 표기 규칙
#   term    화면에 그대로 찍히는 이름. 사용자가 읽을 말로 적는다
#   aliases 같은 것을 가리키는 다른 표기. JD 는 회사마다 다르게 쓴다
#           영문·숫자 낱말은 길이와 무관하게 낱말 경계로 매칭한다
#           — `PMO`·`SQLite`·`Reactive` 오탐을 막는다
#
# 🔴 **문맥 없이 뜻이 갈리는 한글 별칭을 넣지 마십시오.** 한글은 낱말 경계가 없어 부분일치라,
#    짧고 흔한 말을 넣으면 엉뚱한 공고가 걸립니다. 실제로 걸렸던 것들입니다:
#      `인사`   → "인사드립니다" 가 HR 도메인으로     → `인사관리` 로 좁힘
#      `인터뷰` → "면접 인터뷰 일정" 이 사용자 리서치로 → `사용자 인터뷰` 로 좁힘
#      `협업`   → 거의 모든 공고에 있어 신호가 죽음     → `부서 간 협업` 으로 좁힘
#    별칭은 **그 낱말만 보고도 무슨 직무 이야기인지 알 수 있는 길이**로 적으십시오.
#
# 🔴 좁히면 재현율이 깎인다 — 그건 감수한 값이지 공짜가 아닙니다.
#    `협업` 을 뺀 대가로 "개발·디자인과 협업" 같은 문장은 못 잡습니다.
#    그래도 뺀 이유는, 거의 모든 공고에 있는 낱말은 **걸려도 아무것도 알려주지 않기** 때문입니다.
#    놓친 표현이 보이면 그 표현을 통째로 별칭에 더하십시오 — 짧게 자르지 말고.
#
# 🔴 **다시 넣었다가 도로 뺀 것들** — 같은 실수를 반복하지 마십시오.
#      `타 부서`   → "기타 부서" 에 부분일치
#      `관련 부서` → "관련 부서의 비용 정산" 처럼 조율 역량과 무관한 문장에 걸림
#      `인사 담당` → "인사 담당자와 협업" 은 HR 직무가 아니라 협업 대상 이야기
#    재현율을 되찾으려다 정밀도를 잃으면, 걸린 낱말이 근거 구실을 못 합니다.
#
# 직군을 늘리려면 이 파일에 줄을 더하면 된다. PR 로 보내 주셔도 됩니다 (CONTRIBUTING.md).

version: 1

