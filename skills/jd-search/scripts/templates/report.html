<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!-- 🔴 외부 리소스 0. 인라인 CSS/JS만. 인터넷이 끊긴 곳에서도 그대로 열려야 한다. -->
<style>
:root{
  --bg:#fbfbfa; --card:#fff; --line:#e5e4e1; --ink:#1b1b19; --dim:#6f6d68; --faint:#9a9894;
  --g:#1a7f4b; --g-bg:#e8f5ed; --o:#1f6bb8; --o-bg:#e9f1fa;
  --w:#b26a00; --w-bg:#fdf1e0; --r:#c02626; --r-bg:#fdeaea; --u:#6f6d68; --u-bg:#f0efec;
  --accent:#1b1b19;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16161a; --card:#1e1e23; --line:#31313a; --ink:#eceaea; --dim:#a3a1a8; --faint:#75737c;
  --g:#5fcf94; --g-bg:#14301f; --o:#71b3f0; --o-bg:#142430; --w:#e8ab4d; --w-bg:#302410;
  --r:#f08585; --r-bg:#331616; --u:#a3a1a8; --u-bg:#26262c; --accent:#eceaea;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:13px;margin-bottom:20px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 13px;min-width:96px}
.stat b{display:block;font-size:19px;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--dim)}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:11px 0;margin-bottom:12px;
  border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:5px 11px;font-size:12.5px;cursor:pointer;user-select:none}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
select,input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit}
input[type=search]{min-width:170px;flex:1}
.count{margin-left:auto;color:var(--dim);font-size:12.5px;white-space:nowrap}

.row{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:9px}
.row.closed{opacity:.5}
.top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.co{font-weight:660;letter-spacing:-.01em}
.badge{font-size:11px;font-weight:640;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-g{color:var(--g);background:var(--g-bg)} .b-o{color:var(--o);background:var(--o-bg)}
.b-w{color:var(--w);background:var(--w-bg)} .b-r{color:var(--r);background:var(--r-bg)}
.b-u{color:var(--u);background:var(--u-bg)}
.tag{font-size:11px;color:var(--dim);background:var(--u-bg);border-radius:5px;padding:2px 6px}
.vs{font-size:11.5px;font-weight:640}
.vs.up{color:var(--g)} .vs.down{color:var(--r)} .vs.flat{color:var(--dim)}
h2.t{font-size:15px;font-weight:500;margin:5px 0 0}
h2.t a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
h2.t a:hover{border-color:var(--accent)}
.meta{color:var(--dim);font-size:12.5px;margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 12px}
.why{color:var(--dim);font-size:12.5px;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.approx{cursor:help;border-bottom:1px dotted var(--faint)}
a.src{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
a.src:hover{color:var(--ink);border-color:var(--accent)}
details.q{margin-top:7px}
details.q summary{font-size:12.5px;color:var(--o);cursor:pointer}
details.q ol{margin:7px 0 0;padding-left:20px;font-size:13px;color:var(--dim)}
details.q li{margin-bottom:4px}

.empty{text-align:center;color:var(--dim);padding:46px 0;font-size:13.5px}
.foot{margin-top:34px;border-top:1px solid var(--line);padding-top:18px;color:var(--dim);font-size:12.5px}
.foot details{margin-top:10px}
.foot summary{cursor:pointer;color:var(--ink)}
.foot table{border-collapse:collapse;margin-top:10px;width:100%;font-size:12.5px}
.foot td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line);vertical-align:top}
.note{background:var(--w-bg);color:var(--w);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-top:12px}
/* serve 편집 UI — 정적 리포트에서는 쓰이지 않는다 */
.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.act select,.act input{font-size:12px;padding:4px 7px}
.act button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;
  padding:4px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.act button:hover{border-color:var(--accent)}
.act .saved{color:var(--g);font-size:11.5px}
.act .failed{color:var(--r);font-size:11.5px}
.addbar{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:12px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addbar input{flex:1;min-width:240px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div id="warn"></div>
  <div class="stats" id="stats"></div>

  <div class="bar">
    <span id="grades"></span>
    <select id="region"></select>
    <select id="board"></select>
    <select id="sort">
      <option value="grade">좋음 먼저</option>
      <option value="risk">위험 먼저</option>
      <option value="recent">최신 수집순</option>
      <option value="company">회사명순</option>
      <option value="distance">직선거리순</option>
    </select>
    <input type="search" id="q" placeholder="회사·직무 검색">
    <label class="chip" id="hideClosed" aria-pressed="true" tabindex="0">마감 숨김</label>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>
  <div class="empty" id="empty" hidden>조건에 맞는 공고가 없습니다.</div>

  <div class="foot" id="foot"></div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
// 🔴 기본은 **좋음 먼저**다. 사용자가 이 화면에서 하려는 일은 지원할 곳을 고르는 것이다.
//    위험을 맨 위에 올리면 경고는 잘 보이지만 정작 볼 것이 목록 바닥에 깔린다.
//    경고를 먼저 보고 싶을 때가 있어 "위험 먼저"를 따로 남겨 뒀다 — 라벨이 방향을 말하게 했다.
//    미확인은 어느 방향에서도 맨 뒤다. 좋은 것도 나쁜 것도 아니라 **아직 모르는 것**이다.
const ORDER = { g: 0, o: 1, w: 2, r: 3, u: 4 };
const ORDER_RISK = { r: 0, w: 1, o: 2, g: 3, u: 4 };
const state = { grades: new Set(), region: '', board: '', sort: 'grade', q: '', hideClosed: true };
// 확장 지점 — serve 가 편집 UI를 얹는 곳. 정적 리포트에서는 비어 있다.
// 🔴 편집 가능한 화면을 따로 만들지 않는다. UI가 두 벌이 되면 한쪽만 고쳐지고 둘이 갈라진다.
let afterRow = null, rowFilter = null;

$('#title').textContent = D.title;
$('#sub').textContent = `${D.generatedAt} 생성 · 조건 ${D.criteria.regions.length ? D.criteria.regions.join(' / ') : '전국'}`
  + (D.baseline ? ` · 기준선 ${D.baseline.company} (${D.baseline.year})` : '');

// 🔴 부분 성공을 "전수"로 읽게 두지 않는다. 목록 위에, 접지 않고 띄운다.
if (D.incomplete?.length) {
  const n = el('div', 'note');
  n.append(el('b', null, '이번 수집은 완전하지 않습니다 — 이 목록을 전수로 보지 마십시오.'));
  const ul = el('ul'); ul.style.margin = '6px 0 0'; ul.style.paddingLeft = '18px';
  for (const line of D.incomplete) ul.append(el('li', null, line));
  n.append(ul);
  $('#warn').append(n);
}
// 🔴 켜 놓고 한 번도 안 돌린 보드가 있으면 그 보드의 공고는 **존재 자체가 안 보인다.**
if (D.missingBoards?.length) {
  const n = el('div', 'note');
  n.textContent = `${D.missingBoards.join('·')} 는 아직 수집하지 않았습니다 — 그 보드에만 올라온 공고는 이 목록에 없습니다.`;
  $('#warn').append(n);
}

for (const s of D.stats) {
  const n = el('div', 'stat'); n.append(el('b', null, s.value), el('span', null, s.label)); $('#stats').append(n);
}

// 등급 칩
for (const [g, label] of Object.entries(D.gradeLabels)) {
  const n = D.rows.filter(r => r.grade === g).length;
  if (!n) continue;
  const c = el('label', 'chip', `${label} ${n}`);
  c.setAttribute('aria-pressed', 'false'); c.tabIndex = 0; c.dataset.g = g;
  const toggle = () => {
    state.grades.has(g) ? state.grades.delete(g) : state.grades.add(g);
    c.setAttribute('aria-pressed', String(state.grades.has(g))); draw();
  };
  c.onclick = toggle; c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
  $('#grades').append(c);
}

// 지역 셀렉트
const regions = [...new Set(D.rows.map(r => r.region).filter(Boolean))].sort();
$('#region').append(new Option('지역 전체', ''));
for (const r of regions) $('#region').append(new Option(r, r));

// 보드 셀렉트 — 🔴 한 행이 두 보드에 걸릴 수 있다(병합). 출처 어느 쪽이든 걸리면 보인다.
const boards = [...new Set(D.rows.flatMap(r => (r.sources ?? []).map(s => s.board)))].sort();
$('#board').append(new Option('보드 전체', ''));
for (const b of boards) $('#board').append(new Option(D.boardLabels?.[b] ?? b, b));
$('#board').onchange = e => { state.board = e.target.value; draw(); };

$('#region').onchange = e => { state.region = e.target.value; draw(); };
$('#sort').onchange = e => { state.sort = e.target.value; draw(); };
$('#q').oninput = e => { state.q = e.target.value.trim().toLowerCase(); draw(); };
const hc = $('#hideClosed');
const toggleClosed = () => { state.hideClosed = !state.hideClosed; hc.setAttribute('aria-pressed', String(state.hideClosed)); draw(); };
hc.onclick = toggleClosed;
hc.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleClosed(); } };

function draw() {
  const list = $('#list'); list.textContent = '';
  const rows = D.rows.filter(r =>
    (!state.grades.size || state.grades.has(r.grade)) &&
    (!state.region || r.region === state.region) &&
    (!state.board || (r.sources ?? []).some(s => s.board === state.board)) &&
    (!state.hideClosed || r.status !== 'closed') &&
    (!state.q || (r.company + ' ' + r.title).toLowerCase().includes(state.q)) &&
    (!rowFilter || rowFilter(r)));

  rows.sort((a, b) => {
    if (state.sort === 'grade') return (ORDER[a.grade] - ORDER[b.grade]) || a.company.localeCompare(b.company, 'ko');
    if (state.sort === 'risk') return (ORDER_RISK[a.grade] - ORDER_RISK[b.grade]) || a.company.localeCompare(b.company, 'ko');
    if (state.sort === 'company') return a.company.localeCompare(b.company, 'ko');
    if (state.sort === 'distance') return (a.straightKm ?? 9e9) - (b.straightKm ?? 9e9);
    return String(b.collectedAt ?? '').localeCompare(String(a.collectedAt ?? ''));
  });

  $('#count').textContent = `${rows.length} / ${D.rows.length}건`;
  $('#empty').hidden = rows.length > 0;

  for (const r of rows) {
    const box = el('div', 'row' + (r.status === 'closed' ? ' closed' : ''));
    const top = el('div', 'top');
    top.append(el('span', 'co', r.company));
    top.append(el('span', 'badge b-' + r.grade, r.gradeLabel + (r.gradeYear ? ` ${r.gradeYear}` : '')));
    if (r.vsBaseline) {
      const m = { up: '▲ 기준선보다 나음', down: '▼ 기준선보다 못함', flat: '≈ 비슷' }[r.vsBaseline.dir];
      top.append(el('span', 'vs ' + r.vsBaseline.dir, m));
    }
    for (const t of r.tags ?? []) top.append(el('span', 'tag', D.tagLabels[t] ?? t));
    if (r.status === 'closed') top.append(el('span', 'tag', '마감'));
    box.append(top);

    const h = el('h2', 't'); const a = el('a', null, r.title);
    a.href = r.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; h.append(a); box.append(h);

    const meta = el('div', 'meta');
    // 통근 배지는 지역 칸 아래 2행째. 근사치는 앞에 ≈ 를 붙이고 비교 금지를 툴팁에 적는다.
    const reg = el('span', null, r.region ?? '근무지 비공개');
    meta.append(reg);
    if (r.straightKm != null) {
      const d = el('span', r.approx ? 'approx' : null, (r.approx ? '≈ ' : '') + `직선 ${r.straightKm}km`);
      if (r.approx) d.title = '구 중심점 기준 근사치입니다. 회사 간 비교에 쓰지 마십시오.';
      meta.append(d);
    }
    if (r.annualFrom != null) meta.append(el('span', null, r.annualFrom === 0 ? '경력 무관' : `경력 ${r.annualFrom}년+`));
    if (r.dueTime) meta.append(el('span', null, `마감 ${String(r.dueTime).slice(0, 10)}`));
    else if (r.dueKindLabel) meta.append(el('span', null, r.dueKindLabel));
    if (r.appStatus) meta.append(el('span', null, `진행: ${r.appStatus}`));

    // 🔴 같은 자리가 두 보드에 있으면 링크를 둘 다 싣는다. 한쪽이 먼저 내려가기 때문이다.
    const src = el('span');
    (r.sources ?? []).forEach((s, i) => {
      if (i) src.append(document.createTextNode(' · '));
      const a = el('a', 'src', s.label + (s.status === 'closed' ? ' (마감)' : ''));
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      src.append(a);
    });
    meta.append(src);
    box.append(meta);

    // 합치지 않은 중복 후보 — 조용히 두면 같은 자리에 두 번 지원한다.
    if (r.dupHint) {
      const d = el('div', 'why');
      d.textContent = `이 회사에 제목이 비슷한 공고가 ${r.dupHint}건 더 있습니다 — 근거가 약해 합치지 않았습니다. 같은 자리인지 확인해 주십시오.`;
      box.append(d);
    }

    if (r.reasons?.length) box.append(el('div', 'why', r.reasons.join(' · ')));
    else if (r.note) box.append(el('div', 'why', r.note));
    // 사람이 확인해 붙인 법인은 그렇게 적는다 — 자동 판정과 구분되어야 되돌릴 수 있다.
    if (r.confirmedBy) box.append(el('div', 'why', `동명이인 중 "${r.confirmedBy}" 로 확인해 붙인 재무입니다.`));

    if (r.questions?.length) {
      const dt = el('details', 'q');
      dt.append(el('summary', null, `면접에서 물어볼 것 ${r.questions.length}개`));
      const ol = el('ol'); for (const q of r.questions) ol.append(el('li', null, q));
      dt.append(ol); box.append(dt);
    }
    afterRow?.(box, r);
    list.append(box);
  }
}
draw();

// ── 하단: 🔴 제외 건수는 반드시 보인다. 조용히 자르지 않는다. ──────────────
const foot = $('#foot');
foot.append(el('div', null, D.footNote));
if (D.dropped.items.length) {
  const dt = el('details');
  dt.append(el('summary', null, `조건에 맞지 않아 제외한 공고 ${D.dropped.items.length}건 — 사유 보기`));
  const sum = el('div', null, Object.entries(D.dropped.byReason).map(([k, v]) => `${D.reasonLabels[k] ?? k} ${v}건`).join(' · '));
  sum.style.margin = '9px 0 0'; dt.append(sum);
  const tb = el('table');
  for (const d of D.dropped.items) {
    const tr = el('tr');
    tr.append(el('td', null, d.company ?? ''));
    const td = el('td'); const a = el('a', null, d.title ?? '');
    a.href = d.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.style.color = 'inherit'; td.append(a); tr.append(td);
    tr.append(el('td', null, (D.reasonLabels[d.reason] ?? d.reason) + (d.detail ? ` (${d.detail})` : '')));
    tb.append(tr);
  }
  dt.append(tb); foot.append(dt);
}
if (D.ambiguous?.length) {
  const n = el('div', 'note');
  n.textContent = `동명이인이라 재무를 붙이지 않은 회사 ${D.ambiguous.length}곳: ${D.ambiguous.join(', ')}`
    + ` — 어느 법인인지 확인이 필요합니다. (jd-search: node scripts/resolve_company.mjs)`;
  foot.append(n);
}
// 🔴 합치지 않은 중복 후보 총계. 조용히 넘기면 같은 자리에 두 번 지원한다.
if (D.mergeCandidates) {
  const n = el('div', 'note');
  n.textContent = `보드 간 중복일 수 있으나 근거가 약해 합치지 않은 짝 ${D.mergeCandidates}건이 있습니다.`
    + ` 잘못 합치면 서로 다른 자리 하나가 목록에서 사라지므로 합치지 않았습니다 — 해당 행에 안내가 붙어 있습니다.`;
  foot.append(n);
}
/* __EDIT__ */
</script>
</body>
</html>
